name: Deploy

# Deploys only main, and only after CI passed on that exact commit (automatic
# runs via workflow_run; manual runs check the CI run for the commit): staging
# first, then production behind the protected `production` GitHub Environment
# (human reviewer, deployment branch main). Cloudflare credentials are exposed
# only to the deploy step, never to checkout, setup or `pnpm install` scripts.
# Missing credentials fail the job instead of finishing green without a deploy.
# The repository variable DEPLOY_FREEZE (unset or `false` = not frozen) stops
# every deploy during an incident; the production job re-checks it after the
# reviewer's approval, because a run can wait there for hours. Any other value
# refuses (fail closed). Procedure: docs/operations/runbooks.md#deploy-freeze.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Refuse while deploys are frozen
        env:
          DEPLOY_FREEZE: ${{ vars.DEPLOY_FREEZE }}
        run: |
          case "${DEPLOY_FREEZE}" in
            ""|false) ;;
            true)
              echo "::error::DEPLOY_FREEZE is true: deploys are frozen for an incident; refusing to deploy (see docs/operations/runbooks.md#deploy-freeze)"
              exit 1 ;;
            *)
              echo "::error::DEPLOY_FREEZE has an unrecognised value; expected true, false or unset; refusing to deploy"
              exit 1 ;;
          esac
      - id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: echo "sha=${RUN_SHA:-$DISPATCH_SHA}" >> "$GITHUB_OUTPUT"
      # A manual run redeploys main only if CI already passed on that exact commit.
      - name: Require a green CI push run for the commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          ok=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=success" --jq '.total_count')
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::no successful CI push run for ${SHA}; refusing to deploy"
            exit 1
          fi

  staging:
    needs: gate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::staging environment is missing Cloudflare credentials"
            exit 1
          fi
          npx wrangler deploy --env staging
      - run: curl -fsS https://vault-staging.agentkit.best/healthz

  production:
    needs: [gate, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Refuse while deploys are frozen
        env:
          DEPLOY_FREEZE: ${{ vars.DEPLOY_FREEZE }}
        run: |
          case "${DEPLOY_FREEZE}" in
            ""|false) ;;
            true)
              echo "::error::DEPLOY_FREEZE is true: deploys are frozen for an incident; refusing to deploy production (see docs/operations/runbooks.md#deploy-freeze)"
              exit 1 ;;
            *)
              echo "::error::DEPLOY_FREEZE has an unrecognised value; expected true, false or unset; refusing to deploy production"
              exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::production environment is missing Cloudflare credentials"
            exit 1
          fi
          npx wrangler deploy --env=""
      - run: |
          curl -fsS https://vault.agentkit.best/healthz
          curl -fsS -o /dev/null https://vault.agentkit.best/
