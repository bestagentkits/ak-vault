name: Deploy

# Staging deploys on every push to main. Production requires the protected
# `production` GitHub Environment (human reviewer). Both jobs skip with a notice
# when the environment has no Cloudflare credentials configured.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::staging environment has no CLOUDFLARE_API_TOKEN; skipping deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.creds.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.ok == 'true'
        working-directory: worker
        run: npx wrangler deploy --env staging
      - if: steps.creds.outputs.ok == 'true'
        run: curl -fsS https://vault-staging.agentkit.best/healthz

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::production environment has no CLOUDFLARE_API_TOKEN; skipping deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.creds.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.ok == 'true'
        working-directory: worker
        run: npx wrangler deploy
      - if: steps.creds.outputs.ok == 'true'
        run: |
          curl -fsS https://vault.agentkit.best/healthz
          curl -fsS -o /dev/null https://vault.agentkit.best/
